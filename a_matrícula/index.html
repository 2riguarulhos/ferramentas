<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>A Matrícula</title>
  <link rel="stylesheet" href="matricula.css">
</head>
<body>

<header class="topo">
  <h1>A MATRÍCULA</h1>
  <span class="autor">Gilberto Valente da Silva</span>
</header>

<div class="search-container">
  <input
    type="text"
    id="searchInput"
    placeholder="Pesquisar no livro..."

</main>

<button id="btnTop">↑</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="matricula.js"></script>

</html>
