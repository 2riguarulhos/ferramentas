<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>A Matrícula – Gilberto Valente da Silva</title>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
:root {
  --vinho: #7a1f2b;
  --fundo: #f5f5f5;
  --amarelo: #fff59d;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--fundo);
}

/* TOPO */
header {
  background: var(--vinho);
  color: white;
  padding: 24px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 28px;
  letter-spacing: 1px;
}

header p {
  margin: 6px 0 0;
  font-size: 14px;
  opacity: 0.9;
}

/* BUSCA */
.search-container {
  background: white;
  padding: 16px;
  display: flex;
  justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.search-box {
  width: 70%;
  max-width: 700px;
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 14px 18px;
  border-radius: 30px;
  border: 1px solid #ccc;
  font-size: 16px;
  outline: none;
}

.search-box input:focus {
  border-color: var(--vinho);
}

/* PDF */
#viewer {
  padding: 30px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.page {
  position: relative;
  margin-bottom: 25px;
  box-shadow: 0 0 10px rgba(0,0,0,0.15);
}

.textLayer {
  position: absolute;
  inset: 0;
  color: transparent;
}

.textLayer span {
  position: absolute;
  white-space: pre;
  transform-origin: 0% 0%;
}

.highlight {
  background: var(--amarelo);
}

/* BOTÃO SUBIR */
#topBtn {
  position: fixed;
  right: 20px;
  bottom: 20px;
  background: var(--vinho);
  color: white;
  border: none;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  font-size: 20px;
  cursor: pointer;
  display: none;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<header>
  <h1>A MATRÍCULA</h1>
  <p>Gilberto Valente da Silva</p>
</header>

<div class="search-container">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Pesquisar no livro..." />
  </div>
</div>

<div id="viewer"></div>

<button id="topBtn" onclick="window.scrollTo({top:0, behavior:'smooth'})">⬆</button>

<script>
const url = 'livro.pdf';
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc = null;
let textLayers = [];

pdfjsLib.getDocument(url).promise.then(pdf => {
  pdfDoc = pdf;
  renderAllPages();
});

async function renderAllPages() {
  for (let i = 1; i <= pdfDoc.numPages; i++) {
    await renderPage(i);
  }
}

async function renderPage(num) {
  const page = await pdfDoc.getPage(num);
  const viewport = page.getViewport({ scale: 1.4 });

  const pageDiv = document.createElement('div');
  pageDiv.className = 'page';
  pageDiv.style.width = viewport.width + 'px';
  pageDiv.style.height = viewport.height + 'px';

  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;

  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;

  const textLayerDiv = document.createElement('div');
  textLayerDiv.className = 'textLayer';

  pageDiv.appendChild(canvas);
  pageDiv.appendChild(textLayerDiv);
  document.getElementById('viewer').appendChild(pageDiv);

  const textContent = await page.getTextContent();
  pdfjsLib.renderTextLayer({
    textContent,
    container: textLayerDiv,
    viewport,
    textDivs: []
  });

  textLayers.push(textLayerDiv);
}

/* BUSCA + HIGHLIGHT */
document.getElementById('searchInput').addEventListener('input', e => {
  const term = e.target.value.toLowerCase();

  textLayers.forEach(layer => {
    layer.querySelectorAll('span').forEach(span => {
      span.classList.remove('highlight');
      if (term && span.textContent.toLowerCase().includes(term)) {
        span.classList.add('highlight');
      }
    });
  });
});

/* BOTÃO SUBIR */
window.addEventListener('scroll', () => {
  document.getElementById('topBtn').style.display =
    window.scrollY > 400 ? 'block' : 'none';
});
</script>

</body>
</html>
